apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab39-flask
  labels:
    app: minterjt-lab39-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minterjt-lab39-flask
  template:
    metadata:
      labels:
        app: minterjt-lab39-flask
    spec:
      containers:
        - name: flask
          image: cithit/minterjt:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-lab39-flask-service
  annotations:
    metallb.universe.tf/address-pool: minterjt-production
    metallb.universe.tf/allow-shared-ip: minterjt-labs
spec:
  type: LoadBalancer
  loadBalancerIP: 10.48.229.34
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  selector:
    app: minterjt-lab39-flask
